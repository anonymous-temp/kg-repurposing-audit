[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-repurposing-audit"
version = "0.5.1"
description = "Typed and scoped write-back of clinical-trial evidence for knowledge-graph drug repurposing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Rongwei Li"}, {name = "Mengsitong Li"}, {name = "Jie Yang"}, {name = "Tieliang Pang"}, {name = "Zeyuan Wang"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2", "PyYAML>=6,<7", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
benchmark = ["torch>=2.6", "matplotlib>=3.8,<4", "pyarrow>=15"]
schema = ["linkml>=1.8,<2"]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11"]

[project.scripts]
kg-audit = "kg_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
